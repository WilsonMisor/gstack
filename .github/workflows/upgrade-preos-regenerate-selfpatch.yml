name: One-shot PREOS handoff regeneration

on:
  push:
    branches:
      - "upgrade/blueprint-preos-handoffs"

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/blueprint-preos-handoffs
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Regenerate all host skills from templates
        run: bun run gen:skill-docs --host all
      - name: Verify strengthened PREOS handoff output
        run: |
          grep -q 'risk_ids' preos-handoff/SKILL.md
          grep -q 'required_evidence' preos-handoff/SKILL.md
          grep -q 'Deployment ability is not deployment authority' preos-handoff/SKILL.md
          grep -q 'Governed implementation handoff' autoplan/SKILL.md
          grep -q 'PREOS RECOVERY REQUIRED' context-restore/SKILL.md
      - name: Remove one-shot workflow and commit generated output
        run: |
          rm .github/workflows/upgrade-preos-regenerate-selfpatch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'Regenerate strengthened PREOS handoff skill'
          git push origin HEAD:upgrade/blueprint-preos-handoffs
