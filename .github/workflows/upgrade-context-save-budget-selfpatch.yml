name: One-shot context-save catalog budget fix

on:
  push:
    branches:
      - upgrade/blueprint-preos-handoffs

permissions:
  contents: write

jobs:
  trim-regenerate-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: upgrade/blueprint-preos-handoffs
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Trim only catalog-facing context-save description
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('context-save/SKILL.md.tmpl')
          text = p.read_text(encoding='utf-8')
          old = '  Save supplementary semantic working context. Captures git state, decisions made,\n'
          new = '  Save semantic notes. Captures git state, decisions made,\n'
          if old not in text:
              raise SystemExit('expected context-save description anchor not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Regenerate all host skill docs
        run: bun run gen:skill-docs --host all
      - name: Validate catalog budget and PREOS boundary
        run: |
          bun test test/catalog-budget.test.ts
          python3 scripts/validate-preos-integration.py
      - name: Remove one-shot workflow and commit
        run: |
          rm -f .github/workflows/upgrade-context-save-budget-selfpatch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add context-save/SKILL.md.tmpl context-save/SKILL.md scripts/validate-preos-integration.py .github/workflows/upgrade-context-save-budget-selfpatch.yml
          git diff --cached --check
          git commit -m 'Trim context-save catalog description'
          git push origin HEAD:upgrade/blueprint-preos-handoffs
