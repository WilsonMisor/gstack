name: One-shot fork runner portability patch

on:
  push:
    branches:
      - upgrade/blueprint-preos-handoffs

permissions:
  contents: write

jobs:
  port-runners:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: upgrade/blueprint-preos-handoffs
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Replace unavailable fork runner labels only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.github/workflows')
          changed = []
          replacements = []
          pattern = re.compile(r'ubicloud-[A-Za-z0-9._-]+')

          for path in sorted(root.glob('*.yml')):
              if path.name == 'upgrade-runner-portability-selfpatch.yml':
                  continue
              text = path.read_text(encoding='utf-8')
              matches = pattern.findall(text)
              if not matches:
                  continue
              new_text = pattern.sub('ubuntu-latest', text)
              path.write_text(new_text, encoding='utf-8')
              changed.append(str(path))
              replacements.extend((str(path), token) for token in matches)

          if not changed:
              raise SystemExit('No Ubicloud runner labels were found; refusing empty portability patch')

          print('PORTABILITY_CHANGED_FILES')
          for path in changed:
              print(path)
          print('PORTABILITY_REPLACEMENTS')
          for path, token in replacements:
              print(f'{path}: {token} -> ubuntu-latest')
          PY

      - name: Prove no inherited Ubicloud runner token remains
        shell: bash
        run: |
          if grep -RniE 'ubicloud-[A-Za-z0-9._-]+' .github/workflows --include='*.yml'; then
            echo 'Ubicloud runner coupling remains in workflow files.' >&2
            exit 1
          fi

      - name: Lint workflow YAML after runner-only portability change
        shell: bash
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.11@sha256:6f03470d0152251d7f07f7c4dc019dbe7024c72cd952f839544c7798843efa8f -color

      - name: Verify patch scope is workflow runner portability only
        shell: bash
        run: |
          git diff --check
          git diff -- .github/workflows
          OUTSIDE=$(git status --porcelain --untracked-files=all | grep -vE '^[ MADRCU?!]{2} \.github/workflows/' || true)
          if [ -n "$OUTSIDE" ]; then
            echo 'Unexpected changes outside .github/workflows:' >&2
            echo "$OUTSIDE" >&2
            exit 1
          fi

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/upgrade-runner-portability-selfpatch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows
          git diff --cached --check
          git commit -m 'Port fork CI runners to GitHub-hosted Ubuntu'
          git push origin HEAD:upgrade/blueprint-preos-handoffs
