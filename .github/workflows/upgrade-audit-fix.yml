name: One-shot dependency remediation

on:
  push:
    branches:
      - upgrade/blueprint-preos-handoffs

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: upgrade/blueprint-preos-handoffs
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Apply targeted security overrides
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.overrides = {
            ...(pkg.overrides || {}),
            'image-size': 'npm:image-size-next@2.1.1',
            'ip-address': '10.3.1',
            'sharp': '0.35.3'
          };
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE
          bun install
      - name: Verify no HIGH dependency advisories remain
        run: bun audit --audit-level=high
      - name: Verify build
        run: bun run build
      - name: Verify free test suite
        run: bun run test:free
      - name: Enforce bounded dependency-only change
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf 'Changed files:\n%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(package.json|bun.lock)$' || true)"
          if [ -n "$unexpected" ]; then
            echo 'Refusing remediation because unrelated files changed:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 3
          fi
          test -n "$changed"
      - name: Commit targeted dependency remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'WilsonMisor'
          git config user.email '100686890+WilsonMisor@users.noreply.github.com'
          git add package.json bun.lock
          git commit -m 'Resolve remaining high dependency advisories'
          git push origin HEAD:upgrade/blueprint-preos-handoffs
