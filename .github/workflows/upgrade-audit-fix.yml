name: One-shot dependency remediation validation

on:
  push:
    branches:
      - upgrade/blueprint-preos-handoffs

permissions:
  contents: write

jobs:
  validate-and-remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: upgrade/blueprint-preos-handoffs
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Configure canonical free-test git identity
        run: |
          git config --global user.email "free-tests-ci@gstack.test"
          git config --global user.name "Free Tests CI"
          git config --global init.defaultBranch main
          git config --global --add safe.directory '*'
      - name: Apply targeted security overrides
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.overrides = {
            ...(pkg.overrides || {}),
            'image-size': 'npm:image-size-next@2.1.1',
            'ip-address': '10.3.1',
            'sharp': '0.35.3'
          };
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE
          bun install
      - name: Verify HIGH audit is clean
        run: bun audit --audit-level=high
      - name: Install Playwright Chromium exactly as Free Tests
        run: npx playwright install --with-deps chromium
      - name: Install Xvfb + X11 utilities exactly as Free Tests
        run: sudo apt-get install -y --no-install-recommends xvfb x11-utils
      - name: Generate host SKILL.md outputs
        run: bun run gen:skill-docs --host all
      - name: Vendor xterm assets
        run: bun run vendor:xterm
      - name: Build server-node bundle
        run: bash browse/scripts/build-node-server.sh
      - name: Verify complete build
        run: bun run build
      - name: Run canonical free suite
        run: xvfb-run -a bun run test:free
      - name: Recheck HIGH audit after tests
        run: bun audit --audit-level=high
      - name: Enforce dependency-only persisted change
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf 'Changed tracked files:\n%s\n' "$changed"
          test -n "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(package\.json|bun\.lock)$' || true)"
          if [ -n "$unexpected" ]; then
            echo 'Refusing remediation because unrelated tracked files changed:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 3
          fi
      - name: Commit validated dependency remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'WilsonMisor'
          git config user.email '100686890+WilsonMisor@users.noreply.github.com'
          git add package.json bun.lock
          git commit -m 'Resolve remaining high dependency advisories'
          git push origin HEAD:upgrade/blueprint-preos-handoffs
