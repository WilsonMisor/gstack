name: Three Repository Upgrade Acceptance

on:
  push:
    branches:
      - "upgrade/blueprint-preos-handoffs"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: three-repo-acceptance-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out gstack candidate
        uses: actions/checkout@v7
        with:
          path: gstack
          fetch-depth: 0

      - name: Check out Blueprint candidate
        uses: actions/checkout@v7
        with:
          repository: WilsonMisor/wed_dev_skill
          ref: upgrade/source-intake-continuity
          path: blueprint
          fetch-depth: 0

      - name: Check out PREOS candidate
        uses: actions/checkout@v7
        with:
          repository: WilsonMisor/PREOS
          ref: upgrade/session-recovery-wordpress-overlay
          path: preos
          fetch-depth: 0

      - name: Verify exact candidate branches
        run: |
          test "$(git -C blueprint branch --show-current)" = "upgrade/source-intake-continuity"
          test "$(git -C preos branch --show-current)" = "upgrade/session-recovery-wordpress-overlay"
          test "$(git -C gstack branch --show-current)" = "upgrade/blueprint-preos-handoffs" || test "${{ github.event_name }}" = "pull_request"

      - name: Validate Blueprint candidate
        working-directory: blueprint
        run: |
          python3 scripts/validate_blueprint.py
          python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Validate PREOS candidate including WordPress and recovery E2E
        working-directory: preos
        run: |
          python3 scripts/validate-preos.py
          python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Validate gstack governed integration contract
        working-directory: gstack
        run: python3 scripts/validate-preos-integration.py

      - name: Run cross repository invariants and disposable non WordPress E2E
        run: |
          python3 gstack/scripts/validate-three-repo-acceptance.py \
            --blueprint blueprint \
            --preos preos \
            --gstack gstack
