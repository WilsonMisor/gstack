name: Three Repository Upgrade Acceptance

on:
  push:
    branches:
      - "upgrade/blueprint-preos-handoffs"
      - "fix/master-plan-wordpress-e2e"
      - "pasv2/final-residual-remediation"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: three-repo-acceptance-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  PASV2_COMPATIBILITY_MANIFEST: gstack/integration/PASV2-COMPATIBILITY.json

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out gstack candidate
        uses: actions/checkout@v7
        with:
          path: gstack
          fetch-depth: 0

      - name: Load PAS v2 compatibility manifest
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          manifest = json.load(open('gstack/integration/PASV2-COMPATIBILITY.json', encoding='utf-8'))
          blueprint = manifest['components']['blueprint']
          preos = manifest['components']['preos']
          print(f"BLUEPRINT_REPOSITORY={blueprint['repository']}")
          print(f"BLUEPRINT_REF={blueprint['ref']}")
          print(f"PREOS_REPOSITORY={preos['repository']}")
          print(f"PREOS_REF={preos['ref']}")
          print(f"PASV2_COMPATIBILITY_ID={manifest['compatibility_id']}")
          PY

      - name: Check out compatible Blueprint candidate
        uses: actions/checkout@v7
        with:
          repository: ${{ env.BLUEPRINT_REPOSITORY }}
          ref: ${{ env.BLUEPRINT_REF }}
          path: blueprint
          fetch-depth: 0

      - name: Check out compatible PREOS candidate
        uses: actions/checkout@v7
        with:
          repository: ${{ env.PREOS_REPOSITORY }}
          ref: ${{ env.PREOS_REF }}
          path: preos
          fetch-depth: 0

      - name: Verify compatibility manifest bindings
        run: |
          test -n "$PASV2_COMPATIBILITY_ID"
          git -C blueprint rev-parse --verify HEAD
          git -C preos rev-parse --verify HEAD
          test "$(git -C gstack rev-parse HEAD)" = "${{ github.sha }}"
          python3 gstack/scripts/validate-pasv2-compatibility.py \
            --blueprint blueprint \
            --preos preos \
            --gstack gstack

      - name: Validate Blueprint candidate
        working-directory: blueprint
        run: |
          python3 scripts/validate_blueprint.py
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 scripts/validate_source_semantics.py
          python3 scripts/build_codex_distribution.py --check

      - name: Validate PREOS candidate including WordPress and recovery contracts
        working-directory: preos
        run: |
          python3 scripts/validate-preos.py
          python3 scripts/validate-pasv2-remediation-artifacts.py
          python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Validate gstack governed integration contract
        working-directory: gstack
        run: python3 scripts/validate-preos-integration.py

      - name: Enforce Codex Project Contract CI applicability
        working-directory: gstack
        run: python3 scripts/validate-codex-project-contract-applicability.py

      - name: Run cross repository invariants and disposable non WordPress E2E
        run: |
          python3 gstack/scripts/validate-three-repo-acceptance.py \
            --blueprint blueprint \
            --preos preos \
            --gstack gstack

      - name: Run virtual team organizational acceptance audit
        run: |
          python3 gstack/scripts/validate-virtual-team-acceptance.py \
            --blueprint blueprint \
            --preos preos \
            --gstack gstack

      # Secretless repository-controlled acceptance only: this fixture does not
      # authenticate an external Codex model, does not authorize production,
      # and must not deploy the disposable WordPress application.
      - name: Run disposable WordPress three repository E2E
        run: |
          python3 gstack/scripts/validate-three-repo-wordpress-e2e.py \
            --blueprint blueprint \
            --preos preos \
            --gstack gstack