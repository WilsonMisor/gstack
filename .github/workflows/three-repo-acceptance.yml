name: Three Repository Upgrade Acceptance

on:
  push:
    branches:
      - "upgrade/blueprint-preos-handoffs"
      - "fix/master-plan-wordpress-e2e"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: three-repo-acceptance-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  BLUEPRINT_CANDIDATE_SHA: 1010598ac084a77ea0a775ecc0b2a575913c963b
  PREOS_CANDIDATE_SHA: fb41e01e77e8b57ea013a90ef1bfeced9b1a8bd2

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out gstack candidate
        uses: actions/checkout@v7
        with:
          path: gstack
          fetch-depth: 0

      - name: Check out exact Blueprint candidate
        uses: actions/checkout@v7
        with:
          repository: WilsonMisor/wed_dev_skill
          ref: ${{ env.BLUEPRINT_CANDIDATE_SHA }}
          path: blueprint
          fetch-depth: 0

      - name: Check out exact PREOS candidate
        uses: actions/checkout@v7
        with:
          repository: WilsonMisor/PREOS
          ref: ${{ env.PREOS_CANDIDATE_SHA }}
          path: preos
          fetch-depth: 0

      - name: Verify exact candidate identities
        run: |
          test "$(git -C blueprint rev-parse HEAD)" = "$BLUEPRINT_CANDIDATE_SHA"
          test "$(git -C preos rev-parse HEAD)" = "$PREOS_CANDIDATE_SHA"
          test "$(git -C gstack rev-parse HEAD)" = "${{ github.sha }}"

      - name: Validate Blueprint candidate
        working-directory: blueprint
        run: |
          python3 scripts/validate_blueprint.py
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 scripts/validate_source_semantics.py

      - name: Validate PREOS candidate including WordPress and recovery contracts
        working-directory: preos
        run: |
          python3 scripts/validate-preos.py
          python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Validate gstack governed integration contract
        working-directory: gstack
        run: python3 scripts/validate-preos-integration.py

      - name: Run cross repository invariants and disposable non WordPress E2E
        run: |
          python3 gstack/scripts/validate-three-repo-acceptance.py \
            --blueprint blueprint \
            --preos preos \
            --gstack gstack

      - name: Run virtual team organizational acceptance audit
        run: |
          python3 gstack/scripts/validate-virtual-team-acceptance.py \
            --blueprint blueprint \
            --preos preos \
            --gstack gstack

      - name: Run disposable WordPress three repository E2E
        run: |
          python3 gstack/scripts/validate-three-repo-wordpress-e2e.py \
            --blueprint blueprint \
            --preos preos \
            --gstack gstack
