name: One-shot Swift test timeout fix

on:
  push:
    branches:
      - upgrade/blueprint-preos-handoffs

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: upgrade/blueprint-preos-handoffs
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Apply only the Swift compiler-test timeout override
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('ios-qa/scripts/gen-accessors.test.ts')
          text = path.read_text(encoding='utf-8')

          opening = "  test('typechecks beside an internal @Observable app state using a comment marker', () => {\n"
          replacement_opening = (
              "  // This is an external Swift compiler integration test, not a normal in-process unit test.\n"
              "  // On ubuntu-latest swiftc can legitimately take >30s under the concurrent free-suite load,\n"
              "  // while the suite's global per-test ceiling is intentionally 30s. Give only this compiler\n"
              "  // probe 60s; keep all assertions and the global timeout unchanged.\n"
              "  test('typechecks beside an internal @Observable app state using a comment marker', () => {\n"
          )
          if text.count(opening) != 1:
              raise SystemExit(f'expected exactly one target test opening, found {text.count(opening)}')
          text = text.replace(opening, replacement_opening, 1)

          closing = (
              "    if (typecheck.status !== 0) {\n"
              "      throw new Error(`generated accessor failed Swift type checking:\\n${typecheck.stderr}`);\n"
              "    }\n"
              "  });\n\n"
              "  test('strict JSON typing and cross-model validate-before-apply restore run correctly', () => {\n"
          )
          replacement_closing = (
              "    if (typecheck.status !== 0) {\n"
              "      throw new Error(`generated accessor failed Swift type checking:\\n${typecheck.stderr}`);\n"
              "    }\n"
              "  }, 60_000);\n\n"
              "  test('strict JSON typing and cross-model validate-before-apply restore run correctly', () => {\n"
          )
          if text.count(closing) != 1:
              raise SystemExit(f'expected exactly one target test closing, found {text.count(closing)}')
          path.write_text(text.replace(closing, replacement_closing, 1), encoding='utf-8')
          PY
      - name: Enforce one-file bounded change
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf 'Changed files:\n%s\n' "$changed"
          test "$changed" = 'ios-qa/scripts/gen-accessors.test.ts'
      - name: Prove per-test override under the normal 30-second suite default
        run: bun test ios-qa/scripts/gen-accessors.test.ts --timeout=30000
      - name: Commit validated timeout fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'WilsonMisor'
          git config user.email '100686890+WilsonMisor@users.noreply.github.com'
          git add ios-qa/scripts/gen-accessors.test.ts
          git commit -m 'Give Swift compiler integration test bounded headroom'
          git push origin HEAD:upgrade/blueprint-preos-handoffs
